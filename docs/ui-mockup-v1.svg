<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1200" height="780" viewBox="0 0 1200 780" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1B2A4A"/>
      <stop offset="55%" stop-color="#2C4A78"/>
      <stop offset="100%" stop-color="#3F6B9E"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0B1524" stop-opacity="0"/>
      <stop offset="100%" stop-color="#0B1524" stop-opacity="0.55"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#0B1524" flood-opacity="0.18"/>
    </filter>
    <clipPath id="win">
      <rect x="10" y="20" width="1180" height="740" rx="12"/>
    </clipPath>
    <clipPath id="heroClip">
      <rect x="300" y="94" width="870" height="666"/>
    </clipPath>
  </defs>

  <!-- 窗口 -->
  <g filter="url(#shadow)">
    <rect x="10" y="20" width="1180" height="740" rx="12" fill="#F7F8FA" stroke="#E3E6EA"/>
  </g>

  <g clip-path="url(#win)">
    <!-- 主区域：背景图（占位） -->
    <g clip-path="url(#heroClip)">
      <rect x="300" y="94" width="870" height="666" fill="url(#hero)"/>
      <!-- 装饰山形 -->
      <path d="M300 640 L520 470 L700 590 L900 420 L1170 640 L1170 760 L300 760 Z" fill="#16304F" opacity="0.55"/>
      <path d="M300 700 L470 560 L640 660 L820 520 L1010 650 L1170 580 L1170 760 L300 760 Z" fill="#0F2340" opacity="0.75"/>
      <rect x="300" y="94" width="870" height="666" fill="url(#fade)"/>
    </g>

    <!-- 顶部栏 -->
    <rect x="10" y="20" width="1180" height="56" fill="#FFFFFF"/>
    <line x1="10" y1="76" x2="1190" y2="76" stroke="#EDEFF2"/>
    <rect x="30" y="36" width="24" height="24" rx="7" fill="#2F6FEB"/>
    <text x="62" y="54" font-family="Microsoft YaHei UI" font-size="15" font-weight="600" fill="#101828">mcroute</text>

    <!-- 导航（当前页高亮） -->
    <rect x="150" y="32" width="76" height="32" rx="8" fill="#EEF4FF"/>
    <text x="188" y="53" font-family="Microsoft YaHei UI" font-size="13" font-weight="600" fill="#2F6FEB" text-anchor="middle">启动</text>
    <text x="272" y="53" font-family="Microsoft YaHei UI" font-size="13" fill="#667085" text-anchor="middle">下载</text>
    <text x="344" y="53" font-family="Microsoft YaHei UI" font-size="13" fill="#667085" text-anchor="middle">整合包</text>
    <text x="424" y="53" font-family="Microsoft YaHei UI" font-size="13" fill="#667085" text-anchor="middle">设置</text>

    <!-- 窗口按钮 -->
    <text x="1092" y="54" font-family="Segoe MDL2 Assets" font-size="10" fill="#667085">&#xE921;</text>
    <text x="1128" y="54" font-family="Segoe MDL2 Assets" font-size="10" fill="#667085">&#xE922;</text>
    <text x="1164" y="54" font-family="Segoe MDL2 Assets" font-size="10" fill="#667085">&#xE8BB;</text>

    <!-- 左侧栏 -->
    <rect x="10" y="76" width="290" height="684" fill="#FFFFFF"/>
    <line x1="300" y1="76" x2="300" y2="760" stroke="#EDEFF2"/>

    <!-- 账号卡 -->
    <rect x="30" y="100" width="64" height="64" rx="16" fill="#E8EEF9"/>
    <circle cx="62" cy="126" r="12" fill="#B9C7E0"/>
    <path d="M40 158 C40 142 84 142 84 158 Z" fill="#B9C7E0"/>
    <text x="108" y="124" font-family="Microsoft YaHei UI" font-size="15" font-weight="600" fill="#101828">Steve</text>
    <rect x="108" y="132" width="64" height="20" rx="10" fill="#F2F4F7"/>
    <text x="140" y="146" font-family="Microsoft YaHei UI" font-size="11" fill="#667085" text-anchor="middle">离线模式</text>

    <!-- 版本选择 -->
    <text x="30" y="200" font-family="Microsoft YaHei UI" font-size="12" font-weight="600" fill="#98A2B3">选择版本</text>
    <rect x="30" y="212" width="250" height="44" rx="8" fill="#EEF4FF" stroke="#CFE0FF"/>
    <text x="46" y="232" font-family="Microsoft YaHei UI" font-size="13" font-weight="600" fill="#101828">1.20.1 — Fabric 0.19.5</text>
    <text x="46" y="247" font-family="Microsoft YaHei UI" font-size="11" fill="#667085">已装 47 个 mod</text>
    <text x="262" y="240" font-family="Segoe MDL2 Assets" font-size="10" fill="#2F6FEB" text-anchor="middle">&#xE73E;</text>

    <rect x="30" y="264" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="46" y="289" font-family="Microsoft YaHei UI" font-size="13" fill="#344054">1.12.2 — Forge 14.23.5</text>
    <rect x="30" y="312" width="250" height="40" rx="8" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="46" y="337" font-family="Microsoft YaHei UI" font-size="13" fill="#344054">1.7.10 — Forge 10.13.4</text>

    <!-- 主按钮 -->
    <rect x="30" y="640" width="250" height="48" rx="10" fill="#2F6FEB"/>
    <text x="155" y="670" font-family="Microsoft YaHei UI" font-size="15" font-weight="600" fill="#FFFFFF" text-anchor="middle">开始游戏</text>
    <rect x="30" y="698" width="120" height="36" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="90" y="721" font-family="Microsoft YaHei UI" font-size="12" fill="#344054" text-anchor="middle">选择版本</text>
    <rect x="160" y="698" width="120" height="36" rx="9" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="220" y="721" font-family="Microsoft YaHei UI" font-size="12" fill="#344054" text-anchor="middle">实例设置</text>

    <!-- 主区域上的信息卡 -->
    <rect x="720" y="120" width="420" height="96" rx="12" fill="#FFFFFF" opacity="0.94"/>
    <text x="744" y="152" font-family="Microsoft YaHei UI" font-size="13" font-weight="600" fill="#101828">正在准备启动</text>
    <text x="744" y="176" font-family="Microsoft YaHei UI" font-size="12" fill="#667085">1.20.1 · Fabric 0.19.5 · Java 21 · 4 GB</text>
    <rect x="744" y="190" width="372" height="6" rx="3" fill="#EDEFF2"/>
    <rect x="744" y="190" width="232" height="6" rx="3" fill="#2F6FEB"/>

    <!-- 底部状态栏 -->
    <rect x="10" y="738" width="1180" height="22" fill="#FFFFFF"/>
    <line x1="310" y1="738" x2="1190" y2="738" stroke="#EDEFF2"/>
    <text x="30" y="753" font-family="Microsoft YaHei UI" font-size="11" fill="#98A2B3">就绪 · 镜像 mirrors.hit.edu.cn · 7.8 MB/s</text>
  </g>
</svg>
