name: Build and sign

# 什么时候跑：
#   1) 打 tag（v*）时 —— 构建 + 安全自测 + 签名 + 把签名后的 exe 传到 GitHub Release
#   2) 手动触发（Actions 页面点 Run workflow）—— 只构建 + 签名，产出 artifact 供下载
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write      # 上传 Release 资产需要

jobs:
  build-and-sign:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      # ---- 1) 主版本：Kyouka MCLauncher（WPF）----
      - name: Build Kyouka MCLauncher
        run: dotnet build app/KyoukaMCLauncher.csproj -c Release -o build --nologo

      # ---- 2) 自测宿主：legacy 的 WinForms/CLI 工程提供 --selftest-* 命令 ----
      - name: Build legacy CLI (for self-tests)
        run: dotnet build legacy/winforms/McrouteWinForms.csproj -c Release -o build-legacy --nologo

      - name: Sanity check + self-tests
        shell: pwsh
        run: |
          $exe = "build/KyoukaMCLauncher.exe"
          if (-not (Test-Path $exe)) { throw "构建产物不存在: $exe" }
          $size = (Get-Item $exe).Length
          Write-Host "主产物: $size 字节"
          if ($size -lt 80000) { throw "产物太小，构建可能失败了" }

          $cli = "build-legacy/mcroute.exe"
          if (-not (Test-Path $cli)) { throw "自测宿主不存在: $cli" }

          # 安全自测：防 Zip Slip
          & $cli --selftest-security
          if ($LASTEXITCODE -ne 0) { throw "安全自测失败（Zip Slip 防护）" }

          # 流式下载 + SHA-1 校验
          & $cli --selftest-download "https://libraries.minecraft.net/com/google/guava/guava/31.0.1-jre/guava-31.0.1-jre.jar" "119ea2b2bc205b138974d351777b20f02b92704b"
          if ($LASTEXITCODE -ne 0) { throw "下载自测失败" }

      - name: Upload unsigned artifact
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: kyouka-unsigned
          path: build/KyoukaMCLauncher.exe
          if-no-files-found: error
          retention-days: 7

      # ---- 3) 提交签名请求给 SignPath ----
      #    需要仓库 Secrets：
      #      SIGNPATH_API_TOKEN        —— SignPath 网站 → User settings → API tokens
      #      SIGNPATH_ORGANIZATION_ID  —— SignPath 网站 → Organization settings 里的 ID
      - name: Submit signing request to SignPath
        id: sign
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: mcroute
          signing-policy-slug: release-signing
          artifact-configuration-slug: mcroute-exe
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: signed

      # ---- 4) 验证签名真的生效（Status 必须是 Valid）----
      - name: Verify signature
        shell: pwsh
        run: |
          $exe = Get-ChildItem signed -Recurse -Filter KyoukaMCLauncher.exe | Select-Object -First 1
          if (-not $exe) { throw "没拿到签名后的文件" }
          $sig = Get-AuthenticodeSignature $exe.FullName
          Write-Host "签名状态: $($sig.Status)"
          Write-Host "签名者  : $($sig.SignerCertificate.Subject)"
          if ($sig.Status -ne 'Valid') { throw "签名无效: $($sig.Status) / $($sig.StatusMessage)" }

      # ---- 5) 打 tag 时，把签名后的 exe 传上 Release ----
      - name: Upload signed exe to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: signed/**/KyoukaMCLauncher.exe
          fail_on_unmatched_files: true

      # ---- 6) 手动触发时也能下载签名结果 ----
      - name: Upload signed artifact (for manual runs)
        uses: actions/upload-artifact@v4
        with:
          name: kyouka-signed
          path: signed/**/KyoukaMCLauncher.exe
          if-no-files-found: error
          retention-days: 7
